<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Trabalhos de Gustavo Nascimento por empresa.">
    <meta name="theme-color" content="#131415">
    <title>Empresa — Gustavo Nascimento</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="../assets/js/catalog.js" defer></script>
    <script src="../assets/js/ui.js" defer></script>

  <body class="company-page">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>

    <header class="site-header" data-header>
      <div class="shell header-inner">
        <a class="back-link" href="../">← Voltar à página inicial</a>
      </div>
    </header>

    <main id="conteudo">
      <section class="cover tone-dark" aria-label="Demo reel">
        <img class="cover-bg" alt="" data-company-cover hidden>
        <div class="cover-inner shell">
          <button class="cover-play" type="button" data-company-play hidden>
            <span class="cover-title" data-company-name>Empresa</span>
            <span class="play-symbol cover-symbol" aria-hidden="true"></span>
          </button>
          <h1 class="cover-title" data-company-heading hidden></h1>
        </div>
      </section>

      <section class="company-rows" data-company-rows aria-label="Trabalhos"></section>
    </main>

    <footer class="site-footer tone-dark">
      <div class="shell footer-inner">
        <span>Gustavo Nascimento</span>
        <span>Portfólio audiovisual</span>
      </div>
    </footer>
